version: '3.9'
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kylo
      POSTGRES_PASSWORD: kylo_password
      POSTGRES_DB: kylo
    ports:
      - '5432:5432'
    volumes:
      - kylo_pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: .env
    depends_on:
      - db

volumes:
  kylo_pgdata:

